{% extends 'admin_base.html' %}
{% block title %}Compose Message{% endblock %}

{% block content %}
<div class="d-flex align-items-center gap-3 mb-4">
  <a href="{% url 'admin_inbox' %}" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-left"></i>
  </a>
  <h4 class="fw-bold mb-0"><i class="bi bi-pencil-square me-2"></i>Compose Message</h4>
</div>

<div class="row justify-content-center">
  <div class="col-lg-7">

    <div class="card border-0 shadow-sm">
      <div class="card-header bg-dark text-white fw-semibold">
        <i class="bi bi-envelope me-1"></i> New Message to User
      </div>
      <div class="card-body p-4">
        <form method="POST" novalidate>
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label fw-semibold">Select User <span class="text-danger">*</span></label>
            <select name="receiver_id" class="form-select" required>
              <option value="">-- Choose a user --</option>
              {% for u in users %}
              <option value="{{ u.id }}" {% if request.POST.receiver_id == u.id|stringformat:'s' %}selected{% endif %}>
                {{ u.get_full_name }} ({{ u.email }})
              </option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Subject <span class="text-danger">*</span></label>
            <input type="text" name="subject" class="form-control"
                   placeholder="Message subject..." required
                   value="{{ request.POST.subject|default:'' }}">
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Message <span class="text-danger">*</span></label>
            <textarea name="message" class="form-control" rows="7"
                      placeholder="Type your message here..." required>{{ request.POST.message|default:'' }}</textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-warning text-dark fw-semibold px-4">
              <i class="bi bi-send me-1"></i> Send Message
            </button>
            <a href="{% url 'admin_inbox' %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>

  </div>
</div>
{% endblock %}
