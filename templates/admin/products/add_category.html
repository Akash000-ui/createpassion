{% extends 'admin_base.html' %}
{% block title %}Add Category{% endblock %}

{% block content %}
<div class="d-flex align-items-center gap-3 mb-4">
    <a href="{% url 'manage_categories' %}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back</a>
    <h4 class="fw-bold mb-0">Add Category</h4>
</div>

{% include 'partials/messages.html' %}

<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4">
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Category Name <span class="text-danger">*</span></label>
                        <input type="text" name="category_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Description</label>
                        <textarea name="description" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Category Image</label>
                        <input type="file" name="category_image" class="form-control" accept=".jpg,.jpeg,.png,.webp" id="catImg">
                        <div class="mt-2">
                            <img id="catPreview" src="" class="rounded-3 d-none" style="max-height:150px;">
                        </div>
                        <div class="form-text">JPG, PNG, WebP. Max 5MB.</div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-dark px-4">
                            <i class="bi bi-plus-circle me-1"></i> Add Category
                        </button>
                        <a href="{% url 'manage_categories' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('catImg').addEventListener('change', function() {
    const preview = document.getElementById('catPreview');
    if (this.files[0]) {
        preview.src = URL.createObjectURL(this.files[0]);
        preview.classList.remove('d-none');
    }
});
</script>
{% endblock %}
