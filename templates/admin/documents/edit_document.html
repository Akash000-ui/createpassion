{% extends 'admin_base.html' %}
{% block title %}Edit Company PDF{% endblock %}

{% block content %}
<div class="d-flex align-items-center gap-3 mb-4">
    <a href="{% url 'admin_documents' %}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left"></i> Back
    </a>
    <div>
        <h4 class="fw-bold mb-1">Edit Company PDF</h4>
        <p class="text-muted mb-0 small">Update the document details or Google Drive link.</p>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Document Name <span class="text-danger">*</span></label>
                        <input type="text" name="document_name" class="form-control" value="{{ document.document_name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Document Type</label>
                        <select name="document_type" class="form-select">
                            {% for t in type_choices %}
                            <option value="{{ t }}" {% if document.document_type == t %}selected{% endif %}>{{ t }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="3">{{ document.description }}</textarea>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Google Drive PDF Link <span class="text-danger">*</span></label>
                        <input type="url" name="google_drive_url" class="form-control"
                               value="{{ document.google_drive_url }}"
                               placeholder="https://drive.google.com/file/d/.../view" required>
                        <div class="form-text">
                            The Drive file must use <strong>Anyone with the link</strong> and <strong>Viewer</strong> access.
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-dark px-4">
                            <i class="bi bi-check2-circle me-1"></i> Save Changes
                        </button>
                        <a href="{{ document.get_preview_url }}" target="_blank" rel="noopener" class="btn btn-outline-dark">
                            <i class="bi bi-eye me-1"></i> View
                        </a>
                        <a href="{% url 'admin_documents' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
