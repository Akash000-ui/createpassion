{% extends 'admin_base.html' %}
{% block title %}Upload Document{% endblock %}

{% block content %}
<div class="d-flex align-items-center gap-3 mb-4">
    <a href="{% url 'admin_documents' %}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back</a>
    <h4 class="fw-bold mb-0">Upload Document</h4>
</div>

{% include 'partials/messages.html' %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4">
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Title <span class="text-danger">*</span></label>
                        <input type="text" name="title" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Document Type <span class="text-danger">*</span></label>
                        <select name="doc_type" class="form-select" required>
                            <option value="">Select type</option>
                            {% for t in type_choices %}
                            <option value="{{ t }}">{{ t }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">File <span class="text-danger">*</span></label>
                        <input type="file" name="document_file" class="form-control" required
                               accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg">
                        <div class="form-text">Allowed: PDF, Word, Excel, Images (max 10 MB)</div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-dark px-4">
                            <i class="bi bi-upload me-1"></i> Upload
                        </button>
                        <a href="{% url 'admin_documents' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
