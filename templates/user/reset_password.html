{% extends 'base.html' %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<section class="py-5 bg-light min-vh-100 d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                    <div class="card-header bg-dark text-white text-center py-4 border-0">
                        <i class="bi bi-lock-fill fs-1 text-warning d-block mb-2"></i>
                        <h4 class="fw-bold mb-1">Set New Password</h4>
                        <p class="text-muted small mb-0">Resetting password for: <strong>{{ email }}</strong></p>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <form method="POST" action="/reset_password">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label fw-semibold">New Password</label>
                                <div class="input-group">
                                    {{ form.new_password }}
                                    <button type="button" class="btn btn-outline-secondary" id="toggleNew">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                                <div class="form-text">Minimum 8 characters</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Confirm New Password</label>
                                <div class="input-group">
                                    {{ form.confirm_password }}
                                    <button type="button" class="btn btn-outline-secondary" id="toggleConfirm">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-success btn-lg fw-bold">
                                    <i class="bi bi-check-circle me-2"></i> Reset Password
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
{% block extra_js %}
<script>
['toggleNew', 'toggleConfirm'].forEach(function(id) {
    document.getElementById(id).addEventListener('click', function() {
        const inp = this.closest('.input-group').querySelector('input');
        const icon = this.querySelector('i');
        inp.type = inp.type === 'password' ? 'text' : 'password';
        icon.classList.toggle('bi-eye');
        icon.classList.toggle('bi-eye-slash');
    });
});
</script>
{% endblock %}
