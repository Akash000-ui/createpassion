{% extends 'base.html' %}
{% block title %}New Message{% endblock %}

{% block content %}
<div class="container py-5">

  <div class="row justify-content-center">
    <div class="col-lg-7">

      <div class="d-flex align-items-center gap-3 mb-4">
        <a href="{% url 'user_inbox' %}" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-arrow-left"></i>
        </a>
        <h4 class="fw-bold mb-0"><i class="bi bi-pencil-square me-2"></i>New Message to Admin</h4>
      </div>

      {% include 'partials/messages.html' %}

      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-header bg-dark text-white fw-semibold rounded-top-4">
          <i class="bi bi-envelope me-1"></i> Compose Message
        </div>
        <div class="card-body p-4">
          <form method="POST" action="{% url 'user_compose' %}" novalidate>
            {% csrf_token %}

            <div class="mb-3">
              <label class="form-label fw-semibold">To</label>
              <input type="text" class="form-control" value="Admin — CREATE PASSION Support" disabled>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Subject <span class="text-danger">*</span></label>
              <input type="text" name="subject" class="form-control"
                     placeholder="e.g. Issue with my order #ORD-20260601-ABC123" required
                     value="{{ request.POST.subject|default:'' }}">
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold">Message <span class="text-danger">*</span></label>
              <textarea name="message" class="form-control" rows="6"
                        placeholder="Describe your issue or query here...">{{ request.POST.message|default:'' }}</textarea>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-dark fw-semibold px-4">
                <i class="bi bi-send me-1"></i> Send Message
              </button>
              <a href="{% url 'user_inbox' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>

</div>
{% endblock %}
