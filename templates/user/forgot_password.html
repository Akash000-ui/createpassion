{% extends 'base.html' %}
{% block title %}Forgot Password{% endblock %}

{% block content %}
<section class="py-5 bg-light min-vh-100 d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                    <div class="card-header bg-dark text-white text-center py-4 border-0">
                        <i class="bi bi-key-fill fs-1 text-warning d-block mb-2"></i>
                        <h4 class="fw-bold mb-1">Forgot Password</h4>
                        <p class="text-muted small mb-0">Enter your email to reset your password</p>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <form method="POST" action="/forgot_password">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Registered Email</label>
                                {{ form.email }}
                            </div>
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-dark btn-lg fw-bold">
                                    <i class="bi bi-envelope me-2"></i> Verify Email
                                </button>
                            </div>
                        </form>
                        <hr class="my-4">
                        <p class="text-center text-muted mb-0">
                            Remember your password?
                            <a href="/user_login" class="text-dark fw-bold text-decoration-none">Login</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
